name: Sync and deploy

# One workflow on purpose: a commit pushed with GITHUB_TOKEN does not trigger
# other workflows, so the weekly sync has to deploy in the same run.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1" # Mondays 02:30 UTC (08:00 IST): refresh GitHub data
  workflow_dispatch: # "Run workflow" button: refresh now

permissions:
  contents: write # commit src/content/github.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Scheduled and manual runs refresh the data; plain pushes deploy as-is.
      # On any API error the script exits before writing, which fails the run
      # and leaves the live site on last week's data.
      - name: Fetch GitHub data
        if: github.event_name != 'push'
        run: node scripts/sync-github.mts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci
      - run: npm test
      - run: npm run build # writes the static site to out/

      # Commit only after tests and build pass, so bad data never lands.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- src/content/github.json; then
            echo "GitHub data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/github.json
          git commit -m "chore: weekly GitHub data sync"
          git push

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
